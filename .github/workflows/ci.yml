name: CI

# Minutes: a pull request runs once (not once for the push and again for the PR), and the two heavy jobs
# (tests on Postgres and the local chain, and the release gate) run only when the engine changed: docs,
# founder/, backlog/, specs/ and operating-system tools (tools/) skip them, and a skipped job counts as passed.
# Main gets the same check against the commit before the push; tags and manual runs run everything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: engine or site files in this change?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.event.before) || '' }}
        run: |
          # The engine: the API, simulators, eval, chain, fixtures, prompts, the spec the tests read, dependencies,
          # the denylist script a test runs, the public docs pages (their examples run as tests), the SDKs, and this workflow. Anything unknown (no base) runs everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "engine=true" >> "$GITHUB_OUTPUT"; echo "site=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(apps/(api|banksim|faultproxy)/|eval/|chain/|fixtures/|prompts/|spec/|docs/[^/]+\.mdx$|docs/(concepts|guides|webhooks|limits|tools)/|docs/api/|docs/snippets/|sdks/|tools/(build_sdks|build_docs|run_snippets)\.py$|pyproject\.toml$|uv\.lock$|tools/check_denylist\.py$|\.github/workflows/ci\.yml$)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"; else echo "engine=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(apps/site/|eval/|\.github/workflows/ci\.yml$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"; else echo "site=false" >> "$GITHUB_OUTPUT"; fi

  views:
    # Cheap checks that run on every change: lint and the generated documents (roadmap page, backlog).
    name: lint and generated documents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --all-packages --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: OpenAPI file is valid (API-05)
        run: npx --yes @redocly/cli@2.80.0 lint docs/api/openapi.json
      - name: Docs site is complete and the Postman collection is current (DOC-01, SDK-03)
        run: uv run python tools/build_docs.py --check
      - name: The SDKs' generated code is current (SDK-01, SDK-02)
        run: uv run python tools/build_sdks.py --check
      - name: Roadmap is up to date
        run: uv run python tools/build_roadmap_page.py --check
      - name: Backlog documents are up to date
        run: |
          uv run python tools/build_backlog.py
          git diff --exit-code -- backlog/ founder/slices.json

  test:
    name: lint, typecheck, test   # the name stays for branch protection; lint runs in `views`
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: detent
          POSTGRES_PASSWORD: detent
          POSTGRES_DB: detent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detent" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://detent:detent@localhost:5432/detent
      TEST_DATABASE_URL: postgresql+psycopg://detent:detent@localhost:5432/detent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --all-packages --frozen
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build MockUSDC
        run: cd chain && forge build
      - name: Typecheck
        run: uv run mypy
      - name: Migrate
        run: |
          PGPASSWORD=detent psql -h localhost -U detent -d detent -c "CREATE DATABASE detent_test OWNER detent"
          uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Seed demo data
        run: uv run detent seed
      - name: Test (unit, property, integration, concurrency, local chain)
        env:
          REQUIRE_CHAIN: "1"   # chain tests must run in CI, never skip
        run: uv run pytest -p no:cacheprovider

  eval:
    # EVL-07 release gate: the attack and fault suites (and the agent, reconciliation and latency suites) on
    # the local chain and simulators. Any unauthorised execution, duplicate, timeout turned FAILED or
    # auto-approval after a timeout fails the build, whatever the other scores say.
    name: release gate (detent eval)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: detent
          POSTGRES_PASSWORD: detent
          POSTGRES_DB: detent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detent" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://detent:detent@localhost:5432/detent
      EVAL_DATABASE_URL: postgresql+psycopg://detent:detent@localhost:5432/detent_eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --all-packages --frozen
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build MockUSDC
        run: cd chain && forge build
      - name: Run every suite and apply the release gate
        run: uv run detent eval run --suite all
      - name: Keep the dated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: eval/out/
          if-no-files-found: warn

  sdks:
    name: SDKs and docs samples against the CI sandbox
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: detent
          POSTGRES_PASSWORD: detent
          POSTGRES_DB: detent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detent" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://detent:detent@localhost:5432/detent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --all-packages --frozen
      - name: The Python SDK builds and installs from the repo (SDK-01)
        run: |
          uv build --package dekernai --out-dir "$RUNNER_TEMP/dist"
          python3 -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/pip" install --quiet "$RUNNER_TEMP"/dist/dekernai-*.whl
          "$RUNNER_TEMP/sdk-venv/bin/python" -c "import dekernai; print('dekernai', dekernai.__version__, dekernai.API_VERSION)"
      - name: Start the sandbox API with the demo organisation and a throwaway key
        run: |
          pepper=$(openssl rand -hex 24)
          echo "::add-mask::$pepper"
          echo "API_KEY_PEPPER=$pepper" >> "$GITHUB_ENV"
          export API_KEY_PEPPER="$pepper"
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run detent seed
          key=$(uv run detent keys create --user usr_pl --scopes read,intents:create | tail -n1)
          echo "::add-mask::$key"
          echo "DEKERNAI_API_KEY=$key" >> "$GITHUB_ENV"
          echo "DEKERNAI_BASE_URL=http://localhost:8000" >> "$GITHUB_ENV"
          nohup uv run detent api --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/healthz > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: "TypeScript SDK: ESM and CommonJS builds, unit tests and sandbox tests (SDK-02)"
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: "Docs samples in 8 languages: signature vectors and the quickstart payout (DOC-04, WHK-02)"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          php --version | head -n1; ruby --version; node --version
          uv run python tools/run_snippets.py

  site:
    name: marketing site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - name: Logic tests, build, honesty and SEO checks
        run: npm test

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  governance:
    # Operating protocol: slice done needs HANDOFF.md, cited D-/B- IDs exist, register statuses are valid.
    name: governance check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check registers, slices and HANDOFF
        env:
          GOVERNANCE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: python tools/check_governance.py
      - name: Hook and tool tests
        run: |
          python -m pip install --quiet "pytest>=8.3"
          python -m pytest tools/tests -q -p no:cacheprovider -o addopts="" -c /dev/null --rootdir .

  independence:
    name: independence check (OPS-02)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan for denylisted terms
        env:
          DENYLIST: ${{ secrets.INDEPENDENCE_DENYLIST }}
        run: python3 tools/check_denylist.py .
