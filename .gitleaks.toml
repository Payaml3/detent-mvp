# Secret scanning (FND-01). Default rules, plus the prototype's own key format.
[extend]
useDefault = true

[[rules]]
id = "detent-api-key"
description = "DekernAI API key"
regex = '''\bsk_(?:test|live)_[A-Za-z0-9]{16,}\b'''
keywords = ["sk_test_", "sk_live_"]

[allowlist]
description = "Public testnet contract addresses and documented placeholders"
regexes = [
  '''0x036CbD53842c5426634e7929541eC2318f3dCF7e''',
  '''0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238''',
  '''0x000000000000000000000000000000000000dEaD''',
  '''4f7c1e1a-inv-2026-0142''',   # spec/03 example idempotency key
  '''sk_live_0{28}''',             # all-zero live-looking key in the eval attack atk-au-06
]
paths = ['''uv\.lock''', '''__pycache__''', '''\.pytest_cache''', '''\.venv''', '''chain/(out|cache)''']
