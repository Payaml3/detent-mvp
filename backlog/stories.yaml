# Source of truth for the MVP backlog. Edit here, then run: python tools/build_backlog.py
# pri: Must | Should | Could     est: ideal developer-days for one developer working with Claude Code
# ms: milestone (see backlog/milestones.md)   trace: codes from backlog/model-items.yaml

epics:
  FND: {name: "Foundation", goal: "A tested, deployable skeleton with the safety guards in place from day one", track: prototype, layer: "All three (foundation)"}
  INT: {name: "Payment intents", goal: "Every payment starts as an intent with one payment ID for life", track: prototype, layer: "Decision"}
  POL: {name: "Policy and decisions", goal: "A deterministic, versioned, client-owned policy layer decides execute, escalate or block", track: prototype, layer: "Decision"}
  AGT: {name: "Mandates and instruction agent", goal: "An AI agent can propose payments from invoices, only inside a signed mandate, and can never move money", track: prototype, layer: "Decision (agents serve all three)"}
  EXE: {name: "Exactly-once execution", goal: "A payment is sent once: timeouts become UNKNOWN, retries keep the payment ID, the kill switch stops everything", track: prototype, layer: "Orchestration"}
  RAL: {name: "Rails, routing and faults", goal: "Three rails behind one adapter contract, best-rail routing, failover on technical errors only, and fault injection to prove it", track: prototype, layer: "Orchestration"}
  EXC: {name: "Exceptions and investigation", goal: "Every escalation has an owner and a deadline, shows raw facts first, and a timeout never becomes an approval", track: prototype, layer: "Operations"}
  LED: {name: "Ledger, deposits and reconciliation", goal: "One ledger across rails; deposits credited once; mismatches become exceptions with proposed fixes", track: prototype, layer: "Operations"}
  AUD: {name: "Audit and replay", goal: "Every step is recorded append-only and any payment can be replayed and exported", track: prototype, layer: "Operations"}
  CON: {name: "Back-office console", goal: "The screens where the 10-minute demo happens", track: prototype, layer: "All three (console)"}
  EVL: {name: "Evaluation harness", goal: "Measured proof: attacks, faults, interpretation and agreement, gated in CI and published as a results report", track: prototype, layer: "All three (proof)"}
  DEM: {name: "Demo data and scenarios", goal: "Fictional, repeatable demo data and a one-click scenario runner", track: prototype, layer: "All three (demo)"}
  SHD: {name: "Shadow mode", goal: "Decide a client's payments without sending any (the shadow phase of onboarding, or an exported month to calibrate rule set v1) and report agreement", track: prototype, layer: "Decision (shadow mode)"}
  OPS: {name: "Operational controls", goal: "The operating-model processes that need software: incidents, independence check, recovery", track: prototype, layer: "Operations"}
  API: {name: "Public sandbox API", goal: "A provider-grade API: keys, scopes, errors, versioning, limits, logs, OpenAPI", track: portal, layer: "All three (public API)"}
  WHK: {name: "Webhooks", goal: "Signed, retried, logged event delivery", track: portal, layer: "All three (public API)"}
  DSH: {name: "Developer dashboard", goal: "KYB-gated access: owner invite, team and roles, keys, logs, webhooks, sandbox controls, integration verification, usage and the console per organisation", track: portal, layer: "All three (developer access)"}
  SBX: {name: "Sandbox", goal: "Developers trigger every path with test values, inside quotas", track: portal, layer: "All three (developer access)"}
  DOC: {name: "Docs portal", goal: "Concepts, guides and reference with tested samples in 8 languages", track: portal, layer: "All three (developer access)"}
  SDK: {name: "SDKs", goal: "Typed Python and TypeScript clients with automatic idempotency and webhook helpers", track: portal, layer: "All three (developer access)"}
  USR: {name: "User payouts", goal: "Payouts to the platform's own end users, under the user payout profile", track: prototype, layer: "Decision"}
  WEB: {name: "Marketing site", goal: "A public face that looks real and stays honest", track: portal, layer: "Go-to-market"}

stories:
# ---------------- FND Foundation ----------------
- id: FND-01
  epic: FND
  title: Repository, tooling and CI
  as: builder
  want: a monorepo with the API app, migrations, lint, type checks and tests running in CI
  so: every story ships tested and nothing merges red
  ac:
    - "`make test`, `make lint` (ruff) and `make typecheck` (mypy, strict on `detent/domain`) pass locally and in GitHub Actions on every push"
    - "CI starts a Postgres 16 service and runs Alembic migrations before tests"
    - "`.env.example` lists every setting; a secret scanner runs as a pre-commit hook and in CI"
    - "The README explains setup in under 10 commands"
  pri: Must
  est: 0.5
  done: [0, 1, 2, 3]
  deps: []
  trace: [A7.prototype, B5.security]
  ms: S0
- id: FND-02
  epic: FND
  title: Settings and test-network guard
  as: builder
  want: the app to refuse to start with any mainnet chain ID or live credentials
  so: the prototype can never move real money
  ac:
    - "Given a configured chain ID outside {84532 Base Sepolia, 11155111 Ethereum Sepolia, 31337 local}, when the app or worker starts, then it exits with a clear error"
    - "Given an API key prefix `sk_live_`, when any request uses it, then it is rejected with 403 `live_mode_unavailable`"
    - "Settings load via pydantic-settings; no setting is read from os.environ elsewhere"
  pri: Must
  est: 0.25
  done: [0, 1, 2]
  deps: [FND-01]
  trace: [A6.no_custody, L8]
  ms: S0
- id: FND-03
  epic: FND
  title: Baseline schema and ID conventions
  as: builder
  want: the core tables, enums and constraints from spec/02-domain-model.md as the first migration
  so: invariants are enforced by the database, not just by code
  ac:
    - "IDs are prefixed UUIDv7 strings (`pay_`, `att_`, `dec_`, `exc_`, `dep_`, `evt_`, `org_`)"
    - "Money is stored as integer minor units plus an ISO currency code; no floats anywhere in money paths"
    - "Every table carries `org_id`; every query in the repository layer filters by it"
    - "Partial unique indexes from the domain model exist (one in-flight attempt, one confirmed attempt per payment)"
  pri: Must
  est: 0.5
  done: [0, 1, 2, 3]
  deps: [FND-01]
  trace: [A2b.states, A2.Intent]
  ms: S0
- id: FND-04
  epic: FND
  title: Demo login and acting-user switcher
  as: demo viewer
  want: one demo password and a switcher to act as the payments lead, compliance lead, reviewer, backup owner or on-call engineer
  so: the demo shows who is allowed to do what without building full auth
  ac:
    - "One shared password protects the console; after login the viewer picks an acting user"
    - "Every write records the acting user ID and role in the audit log"
    - "Role checks run on the server; hiding a button is never the only control"
  pri: Must
  est: 0.5
  done: [0, 1, 2]
  deps: [FND-03]
  trace: [B3.rule_changes, B3.kill_switch, A2.Exceptions]
  ms: S0
- id: FND-05
  epic: FND
  title: Controllable clock
  as: demo viewer
  want: to fast-forward time in demo mode
  so: deadlines, overdue escalations and UNKNOWN resolution can be shown in minutes
  ac:
    - "All code reads time from a Clock service; a lint rule or test fails on direct `datetime.now()` in `detent/`"
    - "In demo mode the console can advance the clock by 15 min, 1 h or 1 day; outside demo mode the control is absent"
    - "Tests use a frozen clock"
  pri: Must
  est: 0.25
  done: [0, 1, 2]
  deps: [FND-01]
  trace: [B3.exceptions, MVP.flow]
  ms: S0
- id: FND-06
  epic: FND
  title: Background worker and job loop
  as: builder
  want: one worker process running scheduled and queued jobs from Postgres
  so: UNKNOWN resolution, deadline sweeps, chain watching and webhook delivery survive restarts
  ac:
    - "Jobs are claimed with `SELECT ... FOR UPDATE SKIP LOCKED`; each job is idempotent"
    - "Killing the worker mid-job and restarting it never duplicates a side effect (tested)"
    - "Job runs, failures and durations are logged with the payment ID where relevant"
  pri: Must
  est: 0.5
  done: [0, 1, 2]
  deps: [FND-03]
  trace: [B5.resilience]
  ms: S0
- id: FND-07
  epic: FND
  title: Deploy to an EU region
  as: founder
  want: the web app and worker deployed in an EU region with Postgres in an EU region
  so: the demo is reachable and data residency is truthful
  ac:
    - "Web service and worker deploy from main; database is Neon in an EU region"
    - "`/healthz` checks the database and both chain RPCs and reports each"
    - "spec/10-security-and-deploy.md records the regions; the console footer states them"
  pri: Must
  est: 0.5
  deps: [FND-06]
  trace: [B5.hosting, B4.infra, A5.data]
  ms: S9
  done: [1, 2]
- id: FND-08
  epic: FND
  title: Structured logs and request IDs
  as: on-call engineer
  want: JSON logs with request ID and payment ID on every line
  so: any incident can be traced end to end
  ac:
    - "Every HTTP request gets a `request_id`, returned in the `Request-Id` header"
    - "Log lines include `payment_id` when one is in context"
    - "Keys, secrets, full wallet private data and invoice bodies are never logged (tested with a log capture)"
  pri: Should
  est: 0.25
  done: [0, 1]
  deps: [FND-01]
  trace: [B5.security, B3.incident]
  ms: S0
- id: FND-09
  epic: FND
  title: Local EVM with a mock USDC for tests
  as: builder
  want: a local chain (anvil) with a mock 6-decimal USDC contract deployed by script
  so: CI and the fault suite run deterministically without faucets or public RPC limits
  ac:
    - "`make chain` starts anvil and deploys MockUSDC; addresses are written to a test config"
    - "The EVM adapter runs its contract tests against the local chain in CI"
    - "Public testnets are used only in nightly runs and the live demo"
  pri: Must
  est: 0.5
  done: [0, 2]
  deps: [FND-01]
  trace: [L3, A5.gate]
  ms: S0

# ---------------- INT Payment intents ----------------
- id: INT-01
  epic: INT
  title: Create a payout intent
  as: platform integrator
  want: to POST a payout intent with amount, currency, payee, optional network, reference and notes
  so: every payment starts with one ID and gets a decision before any money moves
  ac:
    - "POST /v1/payment_intents returns 201 with a `pay_` ID, the decision and the status"
    - "The payment ID is assigned once and never changes through retries, failovers or approvals"
    - "Invalid input returns 422 with the standard error body and no intent is created"
    - "`source` is `platform` or `agent`; `agent` requires a `mandate_id`"
  pri: Must
  est: 0.5
  deps: [FND-03]
  trace: [A2.Intent, A2b.states]
  ms: S1
  done: [0, 2, 3]
- id: INT-02
  epic: INT
  title: Idempotent creates
  as: platform integrator
  want: an `Idempotency-Key` on every create call
  so: a network retry on my side can never create a second payment
  ac:
    - "Given the same key and the same body, when I repeat the call, then I get the original response and no new intent"
    - "Given the same key and a different body, then I get 409 `idempotency_conflict`"
    - "Keys are scoped per organisation; two parallel requests with one key create exactly one intent (concurrency test)"
  pri: Must
  est: 0.5
  deps: [INT-01]
  trace: [A2.Execute, A6.retry_rule, D.standards, L3]
  ms: S1
  done: [0, 1, 2]
- id: INT-03
  epic: INT
  title: Read and list intents
  as: platform integrator
  want: to fetch an intent with its full timeline and to list intents with filters
  so: I can show status to my users and debug my integration
  ac:
    - "GET /v1/payment_intents/{id} includes decisions, checks, attempts, ledger postings and events"
    - "GET /v1/payment_intents supports cursor pagination and filters by status, rail and created range"
    - "Another organisation's ID returns 404, never 403"
  pri: Must
  est: 0.25
  deps: [INT-01]
  trace: [A2.Prove, D.standards]
  ms: S1
  done: [0, 1, 2]
- id: INT-04
  epic: INT
  title: Counterparty registry with wallet history
  as: payments lead
  want: counterparties with KYB status, wallets or bank accounts, first-seen and last-changed times and payment history
  so: the policy can check "new wallet", "changed details", "first payment" and "above norm" from facts
  ac:
    - "Each payout destination stores `first_seen_at` and `last_changed_at`; editing it updates `last_changed_at` and writes an audit event"
    - "Each counterparty exposes payment count and median amount, computed from confirmed payments"
    - "Counterparties are seeded from fixtures and editable in the console"
  pri: Must
  est: 0.5
  deps: [FND-03]
  trace: [A2.Policy, A2b.unusual, A2b.raw_facts]
  ms: S1
  done: [0, 1, 2]
- id: INT-05
  epic: INT
  title: Cancel an intent before it is sent
  as: payments lead
  want: to cancel an escalated, held or ready intent
  so: a payment we no longer want never goes out
  ac:
    - "Cancel is allowed from ESCALATED, HELD or READY only; from SUBMITTED or UNKNOWN it returns 409"
    - "CANCELLED is terminal and audited with the actor and reason"
  pri: Should
  est: 0.25
  deps: [EXE-01]
  trace: [A2.Intent]
  ms: L
  done: [0, 1]

# ---------------- POL Policy ----------------
- id: POL-01
  epic: POL
  title: Rule-set format and loader
  as: compliance lead
  want: our rules as a versioned YAML rule set with named checks and parameters
  so: the rules are ours, readable and exactly enforced
  ac:
    - "Rule sets follow spec/04-policy.md and are validated against a schema on load; an invalid file is rejected with line-level errors"
    - "A loaded version is immutable and identified by version number and content hash"
    - "Every decision stores the version and hash it used"
  pri: Must
  est: 0.5
  deps: [FND-03]
  trace: [A2.Policy, A6.client_rules, B3.rule_changes]
  ms: S1
  done: [0, 1, 2]
- id: POL-02
  epic: POL
  title: Decision engine and precedence
  as: payments lead
  want: every intent evaluated against all checks with execute, escalate or block and a reason per check
  so: I can see exactly why each payment was decided
  ac:
    - "Each check returns PASS, ESCALATE or BLOCK with a reason code, parameters and evidence references"
    - "Final decision: BLOCK if any check blocks; else ESCALATE if any escalates; else EXECUTE"
    - "Same inputs and rule version always give the same decision (property-based test)"
    - "Rules-only evaluation p95 under 50 ms locally (benchmark in EVL-08)"
  pri: Must
  est: 0.5
  deps: [POL-01, INT-01]
  trace: [A2.Decide, A6.block_final, A1.reviews]
  ms: S1
  done: [0, 1, 2]
- id: POL-03
  epic: POL
  title: Compliance checks (KYB, allowlist, screening, Travel Rule, network)
  as: compliance lead
  want: KYB, allowlist, screening, Travel Rule and allowed-network checks
  so: no payment reaches a payee we haven't cleared
  ac:
    - "KYB not verified -> BLOCK; KYB pending -> ESCALATE"
    - "Payee not on allowlist -> ESCALATE (first payment)"
    - "Mock screening list hit on address or name -> BLOCK `SCREENING_HIT`; screening unavailable -> fail closed per POL-09"
    - "Travel Rule originator and beneficiary fields missing above the configured threshold -> ESCALATE"
    - "Network or currency not allowed for the platform -> BLOCK"
    - "Screening sits behind a `Screening` interface so a real vendor can replace the mock"
  pri: Must
  est: 1.0
  deps: [POL-02, INT-04]
  trace: [A2.Policy, B4.risk_data]
  ms: S1
  done: [0, 1, 2, 3, 4, 5]
- id: POL-04
  epic: POL
  title: Limits and daily caps
  as: compliance lead
  want: an auto-approval limit, a hard maximum and daily caps on routine payments
  so: large or accumulated payments always reach a human, and splitting a payment can't get around a cap
  ac:
    - "Above the auto limit -> ESCALATE; above the hard maximum -> BLOCK"
    - "Daily caps per platform and per counterparty count confirmed plus in-flight amounts"
    - "Cap counters update atomically; 20 parallel intents that together exceed the cap never all execute (concurrency test)"
  pri: Must
  est: 0.5
  deps: [POL-02]
  trace: [A2.Policy, A2b.unusual]
  ms: S1
  done: [0, 1, 2]
- id: POL-05
  epic: POL
  title: Unusual activity as checkable rules
  as: compliance lead
  want: new wallet, changed details, first payment and amount above the counterparty's norm as explicit rules
  so: '"unusual" is something the system can check and a reviewer can verify'
  ac:
    - "Wallet first seen within N days -> ESCALATE `NEW_WALLET`; destination changed within N days -> ESCALATE `CHANGED_DETAILS`"
    - "No prior confirmed payment to this counterparty -> ESCALATE `FIRST_PAYMENT`"
    - "Amount above k x the counterparty's median -> ESCALATE `ABOVE_NORM`"
    - "Each hit stores the raw fact (address, timestamps, median, ratio) as evidence"
  pri: Must
  est: 0.5
  deps: [POL-02, INT-04]
  trace: [A2b.unusual, A2b.raw_facts]
  ms: S3
  done: [0, 1, 2, 3]
- id: POL-06
  epic: POL
  title: A block is final
  as: compliance lead
  want: a blocked payment to stay blocked whatever anyone does next
  so: no approval, retry or other rail can override a compliance decision
  ac:
    - "BLOCKED has no outgoing transitions in the state machine and a database trigger rejects any status change away from it"
    - "Approve, retry, reroute or resubmit on a blocked payment returns 409 `payment_blocked`"
    - "A new intent to the same counterparty or the same destination address within 24 h of a block, whatever the amount, is escalated RESUBMISSION_AFTER_BLOCK with a link to the blocked one (D-10)"
  pri: Must
  est: 0.5
  deps: [POL-02, EXE-01]
  trace: [A6.block_final, A2b.rule, L5]
  ms: S3
  done: [0, 2]
- id: POL-07
  epic: POL
  title: Versioned rule changes with two approvers
  as: compliance lead
  want: rule changes proposed as a new version and activated only after a second person approves
  so: no single person can quietly weaken our controls
  ac:
    - "A proposer creates a draft version; the console shows a diff against the active version"
    - "Activation needs a second, different user; if any rule loosens (higher limit, removed check, shorter screening scope, longer window) the compliance lead must be one of the two"
    - "On activation the compliance lead's attestation is recorded: the client approves these rules and keeps AML accountability"
    - "All versions are kept and readable; decisions link to the version used"
  pri: Must
  est: 0.75
  deps: [POL-01, FND-04]
  trace: [B3.rule_changes, A6.client_rules, B1.contracts, B3.onboarding]
  ms: S6
  done: [0, 1, 2, 3]
- id: POL-08
  epic: POL
  title: Decision-only API
  as: platform integrator
  want: POST /v1/decisions to get a decision without DekernAI executing anything
  so: I can use DekernAI before my own payout process, and shadow mode can reuse the same engine
  ac:
    - "Returns the same decision object as intent creation, with `executed: false`"
    - "Decisions are stored and audited but never create attempts"
  pri: Must
  est: 0.5
  deps: [POL-02]
  trace: [A2.Decide, A3.shadow]
  ms: S1
  done: [0, 1]
- id: POL-09
  epic: POL
  title: Fail closed
  as: compliance lead
  want: any internal error during a decision to hold the payment or send it to manual review
  so: nothing is ever executed unchecked
  ac:
    - "If policy evaluation, screening or a data read fails, the decision is ESCALATE `SYSTEM_UNAVAILABLE` routed by the platform's fail-safe setting (`hold` or `manual_queue`)"
    - "No code path turns an error into EXECUTE (fault-injection test on each dependency)"
  pri: Must
  est: 0.25
  deps: [POL-02]
  trace: [A6.fail_closed, B5.failsafe]
  ms: S1
  done: [0, 1]

# ---------------- AGT Mandates and instruction agent ----------------
- id: MND-01
  epic: AGT
  title: Signed mandate for an AI agent
  as: payments lead
  want: to issue a mandate that limits what an agent may propose (payees, per-payment and total amounts, networks, currencies and expiry)
  so: an agent can only ask for payments inside a scope we signed
  ac:
    - "Mandates are JSON with an HMAC-SHA256 signature by the platform's mandate key (format in spec/05-agents.md)"
    - "Invalid signature, unknown agent or expired mandate are detectable without calling the model"
    - "The format keeps fields that map to AP2-style mandates later"
  pri: Must
  est: 0.5
  deps: [FND-03]
  trace: [A2.Mandate]
  ms: S5
  done: [0, 1, 2]
- id: MND-02
  epic: AGT
  title: Mandate check in the policy
  as: compliance lead
  want: agent-sourced intents checked against their mandate before any other check
  so: an agent can never exceed what we delegated
  ac:
    - "Missing or invalid signature, revoked or expired mandate, payee outside scope, amount above per-payment limit, cumulative total above limit, or network outside scope -> BLOCK with the specific reason"
    - "Cumulative usage updates atomically (concurrency test)"
    - "The check re-runs at execution time"
  pri: Must
  est: 0.5
  deps: [MND-01, POL-02]
  trace: [A2.Mandate, A5.proposes, D.sandbox]
  ms: S5
  done: [0, 1, 2]
- id: MND-03
  epic: AGT
  title: Revoke a mandate
  as: payments lead
  want: to revoke a mandate at once
  so: a misbehaving agent loses its permissions immediately
  ac:
    - "Revocation by console or API takes effect for every intent not yet SUBMITTED"
    - "An approved intent whose mandate is revoked before sending is BLOCKED `MANDATE_REVOKED` at the pre-send re-check"
  pri: Must
  est: 0.25
  deps: [MND-02, EXE-03]
  trace: [A2.Mandate]
  ms: S5
  done: [0, 1]
- id: AGT-01
  epic: AGT
  title: Instruction agent turns an invoice into a proposed intent
  as: payments lead
  want: the instruction agent to read a supplier invoice and propose a structured payment intent
  so: our accounts-payable work can be delegated without giving the agent any power to pay
  ac:
    - "Input: invoice text or PDF; output: payee, matched counterparty, amount, currency, network, wallet, invoice number, due date, each with confidence and the source text span"
    - "Uses the agents model from config (default `claude-sonnet-5-5`) with tool use and a strict JSON schema; output is validated by Pydantic"
    - "Invalid output is retried once, then the proposal is marked `needs_human`"
    - "The canonical $18,500 USDC invoice yields the expected intent on 10 of 10 runs (EVL-04)"
  pri: Must
  est: 1.0
  deps: [INT-04, MND-01]
  trace: [A5.proposes, A2.Intent, L1]
  ms: S5
  done: [0, 1, 2]
- id: AGT-02
  epic: AGT
  title: Flag, never guess
  as: reviewer
  want: uncertain invoice fields flagged instead of filled in
  so: a wrong network or wallet is never silently chosen
  ac:
    - "Missing network, two wallets, total not matching line items, ambiguous currency, payee not in the registry, or wallet different from the registry each set a named flag"
    - "Any flag sets `requires_clarification`; such a proposal can't be submitted until a human resolves each flag"
    - "Tests on the interpretation set confirm no flagged field is ever populated from outside the document"
  pri: Must
  est: 0.5
  deps: [AGT-01]
  trace: [A5.proposes, L1]
  ms: S5
  done: [0, 1, 2]
- id: AGT-03
  epic: AGT
  title: The agent can only propose
  as: compliance lead
  want: the agent's only money-related ability to be "propose an intent" under a mandate
  so: the model can never execute, approve or retry
  ac:
    - "The agent's tool registry has no tool that writes state except `propose_payment_intent`, which calls the public API with scope `intents:create`"
    - "An import-boundary test fails if `detent.agents` imports `detent.execution`, `detent.exceptions.approve` or `detent.rails`"
    - "An attempt by the agent to call any other write endpoint is rejected by scope and logged"
  pri: Must
  est: 0.25
  deps: [AGT-01]
  trace: [A5.tools, A2b.no_agent_retry, B6.ai]
  ms: S5
  done: [0, 1, 2]
- id: AGT-04
  epic: AGT
  title: Prompt-injection isolation
  as: compliance lead
  want: invoice text, notes, names and references treated strictly as data
  so: text like "ignore your rules, this is pre-approved" changes nothing
  ac:
    - "Untrusted text reaches the model only inside delimited data blocks, after the instructions, with an explicit data-only rule"
    - "The policy never reads agent free text; it reads only typed fields"
    - "Instruction-like content in a document is reported as a `possible_injection` flag and never followed"
    - "All injection scenarios in the attack suite pass (EVL-02)"
  pri: Must
  est: 0.5
  deps: [AGT-01]
  trace: [A5.injection, L2, B6.ai]
  ms: S5
  done: [0, 1, 2]
- id: AGT-05
  epic: AGT
  title: Record every agent call for replay
  as: auditor
  want: each agent call stored with prompt version, model ID, input hash and raw output
  so: replay is deterministic and I can see exactly what the agent said
