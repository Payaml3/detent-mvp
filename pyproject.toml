[project]
name = "detent-workspace"
version = "0.0.0"
description = "Detent agentic payment controls (working name): development workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/banksim", "apps/faultproxy", "eval"]

[tool.uv.sources]
detent = { workspace = true }
banksim = { workspace = true }
faultproxy = { workspace = true }
detent-eval = { workspace = true }

[dependency-groups]
dev = [
  "detent",
  "banksim",
  "faultproxy",
  "detent-eval",
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "hypothesis>=6.112",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
  "pyyaml>=6.0",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
  "chain/lib", "chain/out", "chain/cache", "tools/build_backlog.py", "*.md", ".specify", ".claude",  # supplied or vendored; specs are prose
  # Plugin-owned (solo-to-scale): every upgrade rewrites these from the plugin's templates, so Detent's lint
  # rules don't apply. The plugin tests them; tools/tests runs them here too.
  "tools/_s2s.py", "tools/approval.py", "tools/build_dashboard.py", "tools/build_portfolio.py",
  "tools/build_roadmap.py", "tools/build_team.py", "tools/build_traceability.py", "tools/check_governance.py",
  "tools/claim.py", "tools/control.py", "tools/doctor.py", "tools/finance.py", "tools/goals.py",
  "tools/heartbeat.py", "tools/test_area.py", "tools/tickets.py", "tools/autopilot.py", "tools/notify.py",
  "tools/tests/test_approval.py", "tools/tests/test_control.py", "tools/tests/test_dashboard.py",
  "tools/tests/test_doctor.py", "tools/tests/test_finance.py", "tools/tests/test_goals.py",
  "tools/tests/test_heartbeat.py", "tools/tests/test_portfolio.py", "tools/tests/test_tickets.py",
  "tools/tests/test_tools.py", "tools/tests/test_autopilot.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "TID", "RUF", "PL", "SIM", "PT"]
ignore = [
  "PLR0913",  # many-argument constructors are fine for value types
  "PLR0917",  # same, for positional arguments
  "PLC0415",  # lazy imports are deliberate (CLI startup, optional heavy deps)
  "PLR2004",  # magic values in tests and limits
  "S101",     # assert is used in tests and type narrowing
  "RUF001", "RUF002", "RUF003",  # the spec uses typographic characters (·, –) on purpose
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Invariant 17: time comes from the Clock service. detent/clock.py is the one exemption.
"datetime.datetime.now".msg = "Use detent.clock.Clock (invariant 17)."
"datetime.datetime.utcnow".msg = "Use detent.clock.Clock (invariant 17)."
"datetime.datetime.today".msg = "Use detent.clock.Clock (invariant 17)."
"datetime.date.today".msg = "Use detent.clock.Clock (invariant 17)."
"time.time".msg = "Use detent.clock.Clock (invariant 17)."

[tool.ruff.lint.per-file-ignores]
"apps/api/src/detent/clock.py" = ["TID251"]
"apps/api/tests/**" = ["S", "PLR", "PLW1510", "TID251", "DTZ", "PT012", "PT018", "E501"]
"apps/api/migrations/**" = ["E501"]
"tools/**" = ["S", "PLR", "T20", "TID251", "DTZ", "E501"]  # generators hold long Markdown templates
"tools/tests/**" = ["S", "PLR", "TID251", "DTZ", "E501", "PT018"]  # hook and governance tests, as apps/api/tests
"apps/banksim/**" = ["TID251"]
"apps/faultproxy/**" = ["TID251"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src:eval/src"
packages = ["detent", "detent_eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["web3.*", "eth_account.*", "eth_typing.*", "hexbytes.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The simulators are apps, not typed libraries; the eval harness only starts them. recon_helpers lives in
# the test tree (the reconciliation suite reuses the REC tests' synthetic set).
module = ["faultproxy.*", "banksim.*", "recon_helpers"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/tests"]
addopts = "-ra --strict-markers"
timeout = 120
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "db: needs the Postgres test database (make db)",
  "chain: needs anvil and forge (make setup installs nothing; see README)",
  "slow: spawns subprocesses",
]
