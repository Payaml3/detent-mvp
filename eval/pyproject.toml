[project]
name = "detent-eval"
version = "0.0.1"
description = "DekernAI evaluation runner: attack, fault, interpretation and agreement suites (EVL-01..08)"
requires-python = ">=3.12,<3.13"
dependencies = ["detent", "banksim", "faultproxy", "httpx>=0.27", "pyyaml>=6.0", "jinja2>=3.1", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detent_eval"]
