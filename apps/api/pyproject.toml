[project]
name = "detent"
version = "0.1.0"
description = "Dekernai agentic payment controls: API, console and worker (prototype, test networks only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.17",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "web3>=7.6",
  "anthropic>=2.10.0",
  "pdfplumber>=0.11.10",
]

[project.scripts]
detent = "detent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detent"]
