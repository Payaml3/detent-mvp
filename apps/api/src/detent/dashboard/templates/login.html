{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p>Access is by invitation after KYB. There is no public sign-up; your invite email has the link to set a password.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/dashboard/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
  <p class="muted">New to {{ brand }}? <a href="{{ website_url }}/access/">Request access</a></p>
</section>
{% endblock %}
