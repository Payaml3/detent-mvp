[project]
name = "dekernai"
version = "0.1.0"
description = "Python SDK for the DekernAI API: agentic payment controls (sandbox, test networks only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
# Not published yet: the licence and the package index release are founder decisions.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dekernai"]
