- {id: FR-103, area: Webhooks, layer: portal, status: confirmed, stories: [WHK-01, WHK-02, WHK-03],
   src: ["spec/03#webhooks"],
   text: "Webhook endpoints subscribe to the listed event types; deliveries are signed (HMAC-SHA256 with timestamp, 300 s tolerance), at least once, with sequence per payment, retries and a delivery log."}
- {id: FR-104, area: Webhooks, layer: portal, status: confirmed, decision: [G-20], stories: [WHK-03],
   src: ["spec/03#webhooks"],
   text: "Webhook retries back off at 1 min, 5 min, 30 min, 2 h, 6 h and 24 h, then the delivery is marked failed."}
