   src: ["spec/03#webhooks", "spec/02#entities"],
   text: "Webhook signing secrets are shown once and stored encrypted (not hashed), because every delivery is signed with the plaintext secret."}
- {id: FR-105, area: Dashboard, layer: portal, status: confirmed,
