  - {ref: p03, counterparty: cpt_quill, amount: "820.00", currency: GBP, expect: ESCALATE, reason: CHANGED_DETAILS}
  - {ref: p04, counterparty: cpt_harbor, amount: "2650.00", currency: EUR, expect: EXECUTE}
  - {ref: p05, counterparty: cpt_flagged, amount: "500.00", currency: USDC, expect: BLOCK, reason: SCREENING_HIT}
