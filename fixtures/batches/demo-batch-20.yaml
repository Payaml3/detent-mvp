# DEM-03: 20 payouts plus 8 deposits across three rails (Base Sepolia, Ethereum Sepolia, simulated bank).
# Amounts are test values; every name is fictional. User payouts are deferred (founder, D-26), so the
# payouts are all to counterparties (founder choice 2026-11-20, D-32).
# Expected: 1 BLOCK (never re-routed), 2 escalations, 1 failover under the same payment ID (p08: the first
# rail's transfer reverts, so it fails over from Base Sepolia to Ethereum Sepolia), every deposit credited
# once (dep-08's duplicate notification included), and exactly one designed reconciliation break (dep-07).
# Per-counterparty daily caps hold: Harbor EUR 9,240 of 10,000; Lumen USDC 643.42; Kestrel GBP 1,493.
payouts:
  - {ref: p01, counterparty: cpt_harbor, amount: "2400.00", currency: EUR, expect: EXECUTE}
